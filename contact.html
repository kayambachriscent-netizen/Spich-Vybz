            </div>
        </nav>
    </header>

    <main>
        <h1 class="wel">Contact</h1>
        <h2>Send Us a Message</h2>
        <br><br>
        <form>

            <label for="name">Name:</label>
            <input class="box" type="text" id="name" name="name" placeholder="Enter your name" required>
            <br><br>
            <label for="email">Email:</label>
            <input class="box" type="email" id="email" name="email" placeholder="Enter your email" required>

            <br><br>

            <label class="label" for="message">Message:</label>
            <br>
            <textarea class="box" id="message" placeholder="Enter a message"
                      name="message"
                      rows="8"
                      cols="35"
                      required></textarea>

            <br><br>

            <button type="submit" class="btn">Send Message</button>
            <br><br>
        </form>

    </main>

    <footer>
        <p>Dont try sending yet. We are still working on it. To make it efficient for use.</p>
